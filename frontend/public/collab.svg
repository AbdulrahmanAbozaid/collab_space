<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Collaborative document logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- The paper itself is the logo (transparent background) -->
  <path d="M112 32H320L432 144V448a32 32 0 0 1-32 32H112a32 32 0 0 1-32-32V64a32 32 0 0 1 32-32Z" fill="url(#paper)"/>
  <!-- Folded corner -->
  <path d="M320 32V112a32 32 0 0 0 32 32H432Z" fill="#A5B4FC"/>

  <!-- Text lines (white) -->
  <rect x="128" y="200" width="170" height="24" rx="12" fill="#FFFFFF"/>
  <rect x="128" y="256" width="224" height="24" rx="12" fill="#FFFFFF"/>
  <rect x="128" y="312" width="120" height="24" rx="12" fill="#FFFFFF"/>

  <!-- Collaborator cursor 1 (teal) -->
  <rect x="310" y="180" width="8" height="64" rx="4" fill="#2DD4BF"/>
  <rect x="310" y="158" width="48" height="22" rx="7" fill="#2DD4BF"/>

  <!-- Collaborator cursor 2 (amber) -->
  <rect x="260" y="292" width="8" height="64" rx="4" fill="#FBBF24"/>
  <rect x="260" y="356" width="48" height="22" rx="7" fill="#FBBF24"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
